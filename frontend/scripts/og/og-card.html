<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Modelo do card de compartilhamento (1200×630). Gere o PNG com: node scripts/og/render.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(circle at 74% 45%, #2e2e33 0, #0b0b0c 58%); font-family: Inter, sans-serif; color: #fff; position: relative; }
  .stripe { position: absolute; height: 34px; background: #f7aa18; transform: rotate(-28deg); }
  .s1 { width: 760px; right: -170px; bottom: 70px; }
  .s2 { width: 560px; right: -200px; bottom: 18px; opacity: .45; }
  .s3 { width: 200px; height: 18px; left: -40px; top: 36px; opacity: .9; }
  .content { position: absolute; left: 72px; top: 64px; width: 660px; z-index: 2; }
  .logo { height: 64px; display: block; margin-bottom: 26px; }
  .kicker { color: #f7aa18; font-weight: 700; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
  .slash { font-style: italic; font-weight: 900; letter-spacing: -1px; }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; text-transform: uppercase; line-height: .86; font-size: 122px; margin: 10px 0 18px; }
  h1 span { display: block; color: #f7aa18; }
  p { color: #d0d0d6; font-size: 26px; font-weight: 500; line-height: 1.3; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 12px; margin-top: 24px; background: #1fa855; color: #fff; font-weight: 700; font-size: 24px; padding: 14px 26px; border-radius: 999px; }
  .pill svg { width: 30px; height: 30px; }
  .art { position: absolute; right: 96px; top: 118px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, #2e2e33, #141416 70%); box-shadow: 0 0 0 1px #333, 0 0 90px 14px rgba(247,170,24,.28), 0 30px 80px rgba(0,0,0,.6); display: grid; place-items: center; z-index: 2; }
  .art img { width: 54%; }
  .badge { position: absolute; right: 70px; top: 82px; width: 150px; height: 150px; border-radius: 50%; background: #f7aa18; color: #111; display: grid; place-items: center; text-align: center; transform: rotate(-8deg); z-index: 3; line-height: 1; }
  .badge small { display: block; font-weight: 700; font-size: 15px; text-transform: uppercase; }
  .badge strong { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 40px; margin: 4px 0; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="stripe s1"></div><div class="stripe s2"></div><div class="stripe s3"></div>
  <div class="content">
    <img class="logo" src="../../src/assets/logo.png" alt="">
    <div class="kicker">Videira, SC <span class="slash">///</span></div>
    <h1>Supere<span>seus limites</span></h1>
    <p>Chuteiras, tênis, suplementos e moda fitness.</p>
    <div class="pill">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
      Peça pelo WhatsApp
    </div>
  </div>
  <div class="art"><img src="../../src/assets/trophy.png" alt=""></div>
  <div class="badge"><div><small>Monte seu</small><strong>pedido</strong><small>online</small></div></div>
</body>
</html>
